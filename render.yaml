services:
  - type: web
    name: cricbuzz-livestats
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: cricbuzz-cricket.p.rapidapi.com
